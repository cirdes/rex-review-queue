poll_interval_secs = 60
worktrees_dir      = "~/Workspaces/.reviews"
step_timeout_secs  = 900
# wait after the PR leaves your queue (e.g. you approved it) before removing the worktree
remove_grace_secs  = 900
# how often the "done today" counter refreshes (minimum 60)
reviews_today_every_secs = 300

[[repos]]
name  = "owner/repo"
path  = "~/Workspaces/repo"   # local clone of the repo
setup = ["mise trust", "mise install", "bundle install", "pnpm install"]
# ignored paths the setup creates, which may be deleted along with the worktree
# (relative to the worktree root, as git lists them)
disposable_ignored = ["node_modules", "vendor/bundle", "tmp", "log", ".bundle"]

