name: release

# A cada push na main, compila o rrq para os dois Macs e substitui os assets da release rolante
# `main-build` (prerelease): rrq-<target>.tar.gz, o .sha256 ao lado e o version.txt com o SHA do
# commit. É daqui que o `rrq update` baixa (src/update.rs). A release não se chama `main` porque a
# tag dela teria o mesmo nome do branch, e o git passaria a achar `main` ambíguo.
on:
  push:
    branches: [main]

permissions:
  contents: write
  # Proveniência assinada de cada tarball: `gh attestation verify <asset> --repo cirdes/rex-review-queue`.
  id-token: write
  attestations: write

# Dois pushes seguidos publicam um depois do outro: o version.txt nunca volta para uma build mais velha.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE: main-build

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      # Sem um dos dois Macs, nada é publicado.
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - run: rustup target add "$TARGET"

      # O build.rs grava o GITHUB_SHA no binário; o `rrq update` compara com o version.txt.
      - run: cargo build --release --locked --target "$TARGET"

      # O `rrq` fica na raiz do tarball. O .sha256 tem o formato do `shasum`: "<hash>  <arquivo>".
      - name: Empacota
        run: |
          tar -czf "rrq-$TARGET.tar.gz" -C "target/$TARGET/release" rrq
          shasum -a 256 "rrq-$TARGET.tar.gz" > "rrq-$TARGET.tar.gz.sha256"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: rrq-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: rrq-${{ matrix.target }}
          path: |
            rrq-${{ matrix.target }}.tar.gz
            rrq-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rrq-*
          merge-multiple: true

      - name: Publica na release main-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            test -s "dist/rrq-$t.tar.gz"
            test -s "dist/rrq-$t.tar.gz.sha256"
          done
          echo "$GITHUB_SHA" > version.txt

          if ! gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release create "$RELEASE" --prerelease --target "$GITHUB_SHA" \
              --title "rrq (build da main)" \
              --notes "Build mais nova da main, trocada a cada push. Instale ou atualize com \`rrq update\`."
          fi

          # Tarballs primeiro e version.txt por último: quem vê o SHA novo já acha os binários dele.
          gh release upload "$RELEASE" dist/* --clobber
          gh release upload "$RELEASE" version.txt --clobber

          # A tag acompanha o commit publicado.
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE" -f sha="$GITHUB_SHA" -F force=true >/dev/null
